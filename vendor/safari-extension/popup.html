<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      @font-face { font-family: "Comfortaa"; src: url("fonts/comfortaa.woff2") format("woff2"); font-weight: 700; font-display: swap; }
      @font-face { font-family: "InterBody"; src: url("fonts/inter.woff2") format("woff2"); font-weight: 400 600; font-display: swap; }
      :root {
        --ground: #fcf3e4;
        --surface: #fefcf8;
        --ink: #1a1a1a;
        --soft: #5b5246;
        --muted: #6e6453;
        --line: #ece3d0;
        --field-line: #96896F;
        --orange: #e8913a;
        --focus: #B06A1A;
        --success: #3F9D6A;
        --success-ink: #166534;
        --warn: #C99A2E;
        --bad: #9f2d2d;
        --bad-wash: #f8e9e6;
      }
      [hidden] { display: none !important; }
      body {
        width: 300px;
        max-height: 600px;
        margin: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-sizing: border-box;
        font: 13px/1.45 "InterBody", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--ground);
        color: var(--ink);
      }
      /* A touch screen's popup fills the sheet it opens in. */
      @media (hover: none) and (pointer: coarse) {
        body { width: auto; }
      }
      header, footer { flex: none; }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 13px 14px 9px;
      }
      header img { display: block; }
      .word {
        font: 700 16px/1 "Comfortaa", system-ui, sans-serif;
        letter-spacing: -0.3px;
      }
      .desc { color: var(--muted); font-size: 12px; }
      main {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 0 14px 12px;
      }
      /* main scrolls as one column, so no section is squeezed into its own tiny
         scroller; a long attention list keeps a bounded height of its own. */
      main > * { flex: none; }
      #siteIssues {
        max-height: 240px;
        overflow-y: auto;
      }
      #disclosure {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
      }
      .verdict {
        display: grid;
        grid-template-columns: 10px 1fr;
        column-gap: 9px;
        padding: 12px;
        border-radius: 12px;
        background: var(--surface);
      }
      .verdict.attention { background: var(--bad-wash); }
      .verdict.ok,
      .verdict.calm,
      .verdict.unavailable { background: var(--surface); }
      .dot {
        width: 8px;
        height: 8px;
        margin-top: 5px;
        border-radius: 50%;
        background: var(--muted);
      }
      .dot.ok { background: var(--success); }
      .dot.neutral { background: var(--muted); }
      .dot.bad { background: var(--bad); }
      .dot.warn { background: var(--warn); }
      .v-copy { min-width: 0; }
      .v-head {
        margin: 0;
        /* Body face, not Comfortaa. The wordmark is this surface's brand moment;
           a status verdict is UI text, and the display face reads soft and wide
           at 15px where legibility is the whole job. */
        font: 600 14px/1.35 "InterBody", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
      }
      .v-dest { margin-top: 3px; color: var(--soft); }
      .v-why { margin: 7px 0 0; color: var(--soft); font-size: 12px; }
      .v-act { margin-top: 9px; }
      .blk {
        padding: 11px 0;
        border-bottom: 1px solid var(--line);
      }
      .blk-h {
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .04em;
        /* House style is lowercase, authored rather than transform-forced, so a
           third-party proper noun keeps its own case. No ALL CAPS. */
      }
      .site-issue {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 3px 8px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .site-issue:first-child { border-top: 0; padding-top: 0; }
      /* Name and reason always share the first column. A row without a button
         leaves the second column empty, so the hostname gets the full width. */
      .site-issue .h, .site-issue .w { grid-column: 1; }
      .site-issue .h { font-weight: 600; overflow-wrap: anywhere; }
      .site-issue .w { color: var(--soft); font-size: 12px; }
      .site-issue button { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
      .page-line { min-width: 0; }
      .page-host { display: block; font-weight: 600; overflow-wrap: anywhere; }
      .page-state { display: block; margin-top: 1px; color: var(--soft); font-size: 12px; }
      .page-state.ok { color: var(--success-ink); }
      .page-state.bad { color: var(--bad); }
      .page-note { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
      .pact { display: flex; gap: 8px; margin-top: 9px; }
      .pact button { flex: 1 1 0; min-width: 0; }
      .site-count {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        color: var(--soft);
        font-size: 12px;
      }
      button {
        min-height: 34px;
        padding: 7px 10px;
        border: 1px solid var(--field-line);
        border-radius: 9px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
      /* The primary is a filled control with 7.13:1 ink on its orange ground. */
      button.primary {
        border-color: var(--orange);
        background: var(--orange);
        color: var(--ink);
        font-weight: 600;
      }
      button:disabled { cursor: default; opacity: .5; }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
      .action-message { min-height: 0; margin-top: 7px; color: var(--soft); font-size: 12px; }
      .action-message.bad { color: var(--bad); }
      .question { padding: 12px; border-radius: 12px; background: var(--surface); }
      .question p { margin: 0 0 10px; }
      .qact { display: flex; gap: 8px; }
      .qact button { flex: 1 1 0; min-width: 0; }
      .about-details summary { cursor: pointer; color: var(--soft); font-size: 12px; }
      .about-block { white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; font: inherit; margin: 0 0 8px; }
      .about-block:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      .sheet { padding: 0 14px 14px; }
      .sheet h1 { margin: 0; font: 700 16px/1.3 "Comfortaa", system-ui, sans-serif; }
      .sheet p { margin: 10px 0 0; color: var(--soft); }
      .sheet .strongish { color: var(--ink); }
      .destbox {
        margin-top: 12px;
        padding: 10px 11px;
        border-radius: 10px;
        background: var(--surface);
      }
      .destbox .k { color: var(--muted); font-size: 11px; letter-spacing: .04em; }
      .destbox .v { margin-top: 3px; font-weight: 600; }
      .destbox .u { margin-top: 2px; color: var(--soft); font-size: 12px; overflow-wrap: anywhere; }
      .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 13px; }
      footer {
        padding: 9px 14px 12px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        text-align: right;
      }
      /* Safari's popup on iPhone and iPad is a sheet under its own title and done
         button, so it needs no header: one site, one action, one row to settings. */
      :root.mobile { color-scheme: light dark; }
      .mobile body {
        width: auto;
        max-height: none;
        font: 17px/1.35 -apple-system, system-ui, sans-serif;
      }
      .mobile header, .mobile footer, .mobile #about, .mobile .blk-h { display: none; }
      :root.ipad body { width: 360px; }
      .mobile main { padding: 8px 16px 24px; overflow-y: visible; }
      .mobile .verdict { padding: 14px 16px; border-radius: 14px; margin-bottom: 8px; }
      .mobile .v-head { font: 600 17px/1.3 -apple-system, system-ui, sans-serif; }
      .mobile .v-why, .mobile .site-issue .w { font-size: 15px; }
      .mobile .blk { padding: 12px 0; border-bottom: 0; }
      .mobile .question { padding: 14px 16px; border-radius: 14px; margin-bottom: 8px; }
      .mobile .page-host { font-size: 28px; line-height: 1.2; font-weight: 700; }
      .mobile .page-state, .mobile .page-note { margin-top: 2px; font-size: 15px; }
      .mobile .pact { flex-direction: column; margin-top: 16px; }
      .mobile .pact button { flex: none; }
      .mobile button { min-height: 50px; border-radius: 14px; font-size: 17px; }
      .mobile button.primary { font-weight: 600; }
      .mobile .page-learn { display: block; margin-top: 0; font-size: 15px; color: var(--soft); }
      .mobile .page-learn[hidden] { display: none; }
      .mobile .page-learn summary {
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink);
        text-decoration: underline;
        text-underline-offset: 2px;
        list-style: none;
        cursor: pointer;
      }
      .mobile .page-learn summary::-webkit-details-marker { display: none; }
      .mobile .page-learn p { margin: 8px 0 0; }
      .mobile #siteCount { margin-top: 12px; padding: 0; }
      .mobile .site-count {
        min-height: 50px;
        box-sizing: border-box;
        align-items: center;
        padding: 0 16px;
        border-radius: 14px;
        background: var(--surface);
        font-size: 15px;
      }
      .mobile .site-count a { color: var(--ink); text-decoration: none; white-space: nowrap; font-size: 17px; }
      @media (prefers-color-scheme: dark) {
        :root.mobile {
          --ground: #1c1c1e;
          --surface: #2c2c2e;
          --ink: #f5f5f7;
          --soft: #aeaeb2;
          --muted: #8e8e93;
          --line: #3a3a3c;
          --field-line: #636366;
          --bad-wash: #3a2422;
        }
        .mobile button.primary { color: #1a1a1a; }
      }
    </style>
  </head>
  <body>
    <header>
      <img id="headerMark" src="brand/mark-connecting.svg" width="20" height="20" alt="" />
      <span class="word" data-i18n="browser.brand.name"></span>
      <span class="desc" data-i18n="browser.chrome.inyourbrowser"></span>
    </header>

    <main id="popupMain">
      <section id="verdict" class="verdict calm" role="status">
        <span id="verdictDot" class="dot neutral" aria-hidden="true"></span>
        <div class="v-copy">
          <h1 id="verdictHeadline" class="v-head"></h1>
          <div id="verdictSub" class="v-dest"></div>
          <div id="verdictNote" class="v-dest" hidden></div>
          <p id="verdictReason" class="v-why" hidden></p>
          <div id="verdictActions" class="v-act"></div>
        </div>
      </section>

      <section id="siteIssues" class="blk" hidden>
        <h2 class="blk-h" data-i18n="browser.popup.attentionheading"></h2>
        <div id="siteIssueRows"></div>
      </section>

      <section id="page" class="blk">
        <h2 class="blk-h" data-i18n="browser.popup.thispage"></h2>
        <div class="page-line">
          <span id="pageHost" class="page-host"></span>
          <span id="currentPageState" class="page-state"></span>
        </div>
        <p id="pageNote" class="page-note" hidden></p>
        <div class="pact">
          <button id="pageSiteAction" type="button"></button>
          <button id="pageSiteSecondary" type="button" hidden></button>
          <button id="pauseAction" type="button"></button>
        </div>
        <div id="actionMessage" class="action-message" aria-live="polite"></div>
        <details id="pageLearn" class="page-learn" hidden>
          <summary data-i18n="browser.popup.whattakes"></summary>
          <p id="pageLearnWhat"></p>
          <p id="pageLearnUnsent"></p>
          <p id="pageLearnWhere"></p>
        </details>
      </section>

      <section id="siteCount" class="blk" hidden>
        <h2 class="blk-h" data-i18n="browser.popup.sharing"></h2>
        <div class="site-count">
          <span id="siteCountText"></span>
          <a id="allSitesLink" href="#" data-i18n="browser.popup.manage"></a>
        </div>
      </section>

      <section id="about" class="blk">
        <details class="about-details">
          <summary data-i18n="browser.popup.about"></summary>
          <pre id="aboutBlock" class="about-block" tabindex="0"></pre>
          <button id="aboutCopy" type="button" data-i18n="browser.popup.copybutton" data-i18n-args='{"phase":"copy"}'></button>
          <div id="aboutMessage" class="action-message" aria-live="polite"></div>
        </details>
      </section>
    </main>

    <section id="disclosure" class="sheet" hidden>
      <h1 id="disclosureTitle"></h1>
      <p id="disclosureWhat" class="strongish"></p>
      <p id="disclosureUnsent"></p>
      <div class="destbox">
        <div class="k" data-i18n="browser.chrome.itgoesto"></div>
        <div id="disclosureDestination" class="v"></div>
        <div id="disclosureDestinationDetail" class="u"></div>
      </div>
      <p id="disclosureChrome"></p>
      <div class="acts">
        <button id="disclosureConfirm" class="primary" type="button"></button>
        <button id="disclosureCancel" type="button"></button>
      </div>
    </section>

    <footer id="popupFooter">
      <a href="#" id="settingsLink" data-i18n="browser.popup.settings"></a>
    </footer>

    <script src="i18n/catalog.js"></script>
    <script src="i18n/contracts.js"></script>
    <script src="i18n/index.js"></script>
    <script src="lib/copy.js"></script>
    <script src="lib/about.js"></script>
    <script src="lib/hosts.js"></script>
    <script src="lib/status.js"></script>
    <script src="lib/failures.js"></script>
    <script src="lib/disclosure.js"></script>
    <script src="lib/popup_view.js"></script>
    <script src="lib/actions.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
