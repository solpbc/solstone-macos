<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="solstone">
  <title>solstone</title>
  <!-- hand-tuned for 16px renders (Spotlight, menubar, favicon).
       Same composition as canonical sol-app-icon.svg; ring annulus thickened
       from sw=1.7 to sw=2.7 (outer r=7.85, inner r=5.15) so the ring stays
       sharp when rasterized at 16x16 (canonical sw=1.7 subpixel-fluctuates).
       Rays unchanged — they smear into a halo at 16, which reads acceptably as "sun."
       Render this SVG at 16x16; never render the canonical at 16 then upscale. -->
  <rect width="1024" height="1024" fill="#FAF3E4"/>
  <g transform="translate(26.55, 26.55) scale(30.34)">
    <path fill="#F5C740" d="M16.0 2.5 L18.6 7.3 A9.1 9.1 0 0 0 13.4 7.3 Z M23.9 5.1 L23.2 10.5 A9.1 9.1 0 0 0 19.0 7.4 Z M28.8 11.8 L25.1 15.8 A9.1 9.1 0 0 0 23.5 10.9 Z M28.8 20.2 L23.5 21.1 A9.1 9.1 0 0 0 25.1 16.2 Z M23.9 26.9 L19.0 24.6 A9.1 9.1 0 0 0 23.2 21.5 Z M16.0 29.5 L13.4 24.7 A9.1 9.1 0 0 0 18.6 24.7 Z M8.1 26.9 L8.8 21.5 A9.1 9.1 0 0 0 13.0 24.6 Z M3.2 20.2 L6.9 16.2 A9.1 9.1 0 0 0 8.5 21.1 Z M3.2 11.8 L8.5 10.9 A9.1 9.1 0 0 0 6.9 15.8 Z M8.1 5.1 L13.0 7.4 A9.1 9.1 0 0 0 8.8 10.5 Z"/>
    <path fill="#B06A1A" fill-rule="evenodd"
          d="M 23.85 16 A 7.85 7.85 0 1 0 8.15 16 A 7.85 7.85 0 1 0 23.85 16 Z M 21.15 16 A 5.15 5.15 0 1 0 10.85 16 A 5.15 5.15 0 1 0 21.15 16 Z"/>
  </g>
</svg>
